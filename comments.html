<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Messages | Ziad & Hana</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--paper:#fffdf8;--cream:#e8dfd0;--brown:#5c4033;--olive:#2c3a2e;--sage:#91a77d}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:28px 18px;background:radial-gradient(circle at top,#fffdf8 0,#f4efe6 48%,#e8dfd0 100%);color:var(--olive);font-family:Montserrat,sans-serif}
.page{max-width:760px;margin:auto}
header{text-align:center;margin:20px 0 30px}.eyebrow{color:var(--brown);font:600 .75rem Cinzel,serif;letter-spacing:3px;text-transform:uppercase}h1{font:400 clamp(3rem,10vw,5rem) Great Vibes,cursive;color:var(--brown);margin:10px 0}header p{line-height:1.7;max-width:520px;margin:auto}.back{display:inline-block;margin-top:18px;color:var(--olive);font-weight:700;text-decoration:none;border-bottom:1px solid var(--sage);padding-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat,.comments{background:rgba(255,253,248,.86);border:1px solid rgba(92,64,51,.16);box-shadow:0 12px 30px rgba(44,58,46,.1);border-radius:8px}.stat{padding:20px 12px;text-align:center}.stat strong{display:block;color:var(--brown);font-size:1.8rem}.stat span{font-size:.7rem;letter-spacing:1px;text-transform:uppercase}.comments{padding:24px}.comments h2{font:600 1rem Cinzel,serif;letter-spacing:1px;margin-bottom:16px;color:var(--brown)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filter-btn{border:1px solid rgba(92,64,51,.25);background:transparent;color:var(--olive);border-radius:999px;padding:9px 14px;font:600 .72rem Montserrat,sans-serif;cursor:pointer}.filter-btn.active,.filter-btn:hover{background:var(--olive);border-color:var(--olive);color:var(--paper)}.comment-entry{padding:16px 0;border-top:1px solid rgba(92,64,51,.15)}.comment-entry div{display:flex;justify-content:space-between;gap:12px}.comment-entry span{color:var(--brown);font-size:.75rem}.comment-entry p{margin-top:8px;line-height:1.6}.empty-state{text-align:center;color:#68755a;padding:20px 0}.actions{text-align:center;margin-top:20px}.action-btn{margin:4px;padding:11px 16px;border:1px solid var(--brown);border-radius:20px;background:var(--brown);color:var(--paper);font:600 .72rem Montserrat,sans-serif;cursor:pointer}.action-btn.secondary{background:transparent;color:var(--olive);border-color:var(--sage)}
@media(min-width:900px){.page{max-width:980px}.comments{padding:32px 40px}.comment-entry{padding:20px 12px}}@media(max-width:520px){body{padding:18px 12px}.stats{gap:7px}.stat{padding:16px 5px}.stat strong{font-size:1.4rem}.stat span{font-size:.58rem}.comment-entry div{display:block}.comment-entry span{display:block;margin-top:4px}.comments{padding:18px 14px}h1{font-size:clamp(3rem,18vw,4.5rem)}header p{font-size:.88rem}.back{min-height:44px;padding-top:10px}}
</style>
</head>
<body>
<main class="page">
<header>
    <div class="eyebrow">Ziad & Hana</div>
    <h1>Guest Messages</h1>
    <p>Every kind word and confirmed guest is part of our celebration.</p>
    <a class="back" href="index.html">Back to invitation</a>
</header>
<section class="stats" aria-label="Guest summary">
    <div class="stat"><strong id="totalGuests">0</strong><span>Confirmed guests</span></div>
    <div class="stat"><strong id="confirmedGuests">0</strong><span>Yes responses</span></div>
    <div class="stat"><strong id="responseCount">0</strong><span>Total responses</span></div>
</section>
<section class="comments">
    <h2>Messages from our guests</h2>
    <div class="filters" role="group" aria-label="Filter responses">
        <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="yes" aria-pressed="false">Coming</button>
        <button class="filter-btn" type="button" data-filter="no" aria-pressed="false">Not attending</button>
    </div>
    <div id="commentsList"><p class="empty-state">Loading messages...</p></div>
    <div class="actions">
        <button class="action-btn secondary" id="refreshComments" type="button">Refresh</button>
    </div>
</section>
</main>
<script>
const SUPABASE_URL = "https://utcsratghqeadxboauhu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8mhcy9BGU2bimmWeoZztMw_UzjfUm7N";
let rsvps = [];
let responseFilter = "all";

async function supabaseRequest(path, options = {}) {
    if (SUPABASE_URL.startsWith("PASTE_") || SUPABASE_ANON_KEY.startsWith("PASTE_")) {
        throw new Error("Supabase configuration is missing.");
    }
    const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        ...(options.headers || {})
    }});
    if (!response.ok) throw new Error(`Supabase request failed: ${response.status}`);
    if (response.status === 204) return null;
    const responseText = await response.text();
    return responseText ? JSON.parse(responseText) : null;
}

function attendeeCount() {
    return rsvps.filter((rsvp) => rsvp.attending === "yes").reduce((total, rsvp) => total + Number(rsvp.guests || 0), 0);
}

function escapeHtml(value) {
    return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function renderComments() {
    const visible = responseFilter === "all" ? rsvps : rsvps.filter((rsvp) => rsvp.attending === responseFilter);
    document.getElementById("totalGuests").innerText = attendeeCount();
    document.getElementById("confirmedGuests").innerText = rsvps.filter((rsvp) => rsvp.attending === "yes").length;
    document.getElementById("responseCount").innerText = rsvps.length;
    document.getElementById("commentsList").innerHTML = visible.length ? visible.slice().reverse().map((rsvp) => {
        const status = rsvp.attending === "yes" ? `Coming · ${rsvp.guests} guest${rsvp.guests === 1 ? "" : "s"}` : "Not attending";
        return `<article class="comment-entry"><div><strong>${escapeHtml(rsvp.name)}</strong><span>${status}</span></div><p>${escapeHtml(rsvp.comment || "No message added.")}</p></article>`;
    }).join("") : `<p class="empty-state">${rsvps.length ? "No responses in this filter yet." : "No responses yet."}</p>`;
}

async function loadComments() {
    try {
        rsvps = await supabaseRequest("rsvps?select=id,name,attending,guests,comment,created_at&order=created_at.asc");
        renderComments();
    } catch (error) {
        document.getElementById("commentsList").innerHTML = "<p class=empty-state>Shared storage is not configured yet.</p>";
        console.error(error);
    }
}

document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => {
    responseFilter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((item) => {
        const active = item === button;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
    });
    renderComments();
}));
document.getElementById("refreshComments").addEventListener("click", loadComments);
loadComments();
window.setInterval(loadComments, 10000);
</script>
</body>
</html>
